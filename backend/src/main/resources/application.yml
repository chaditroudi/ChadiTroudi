server:
  port: 8080

spring:
  application:
    name: codecamp-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/codecamp
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:https://lkyuqqnmfmylyfssntrp.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_URI:https://lkyuqqnmfmylyfssntrp.supabase.co/auth/v1/.well-known/jwks.json}

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://chaditroudi.com}

logging:
  level:
    com.codecamp: DEBUG
    org.hibernate.SQL: DEBUG
